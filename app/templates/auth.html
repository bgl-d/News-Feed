<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>News</title>
        <!-- Bootstrap -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <!-- CSS -->
        <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    </head>
    <body>
        <div class="auth">
            <div class="auth-box" id="auth-login-form" style="display: flex;">
                <form class="auth-form" id="login">
                    <input id="email-input" type="Email" placeholder="Email" required><br>
                    <input type="Password" placeholder="Password" required><br>
                    <button type="submit" class="submit-btn" id="login-btn">Login</button>
                </form>
                <p>Don't have an account?</p> 
                <button class="change-auth-btn" onclick="openSignUp()">Sign Up</button>
            </div>
            
            <div class="auth-box" id="auth-signup-form" style="display: none;">
                <form class="auth-form" id="signup">
                    <input type="Handle" placeholder="Handle" required><br>
                    <input type="First name" placeholder="First name" required><br>
                    <input type="Last name" placeholder="Last name" required><br>
                    <input type="Email" placeholder="Email" required><br>
                    <input type="Password" placeholder="Password" required><br>
                    <input type="Password" placeholder="Repeat password" required><br>
                    <button type="submit" class="submit-btn" id="signup-btn">Sign Up</button>
                </form>    
                <p>Already have an account?</p> 
                <button class="change-auth-btn" onclick="openLogin()">Login</button>
            </div>
        </div>
        <script src="{{ url_for('static', path='auth.js') }}"></script>
    </body>
</html>
