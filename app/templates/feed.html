<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">

</head>
<body>
  <!-- Navbar -->
  <div class="header">
    <button type="button" class="btn rounded-circle" title="new post" id="create-post-button" onclick="openForm()">+</button>
    <nav class="navbar navbar-expand-lg navbar-light floating-navbar">
      <div class="navbar-collapse">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <a class="nav-link" href="/feed">News</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/feed/follow">Following</a>
          </li>
        </ul>
      </div>
    </nav>
    <button type="button" class="btn rounded-circle" id="logout-button" title="log out">|-></button>
  </div>

  <!-- Feed -->
  <div class="container feed">
    <div class="media" id="media-1">
      <img class="mr-3 news-image" id="media-1-img">
      <div class="media-body">
        <h3 class="mt-0" id="media-body-title-1"></h3>
        <p id="created_at_1" class="created_at"></p>
        <p id="media-body-text-1"></p>
      </div>
    </div>
    <div class="media" id="media-2">
      <img class="mr-3 news-image" id="media-2-img">
      <div class="media-body">
        <h3 class="mt-0" id="media-body-title-2"></h3>
        <p id="created_at_2" class="created_at"></p>
        <p id="media-body-text-2"></p>
      </div>
    </div>
    <div class="media" id="media-3">
      <img class="mr-3 news-image" id="media-3-img">
      <div class="media-body">
        <h3 class="mt-0" id="media-body-title-3"></h3>
        <p id="created_at_3" class="created_at"></p>
        <p id="media-body-text-3"></p>
      </div>
    </div>    
  </div>

  <!-- Pagination -->
  <div class="pagination">
    <a class="page-btn active" value=1 onclick="setActive(this)">1</a>
  </div>
  
<div class="overlay" id="overlay" onclick="closeForm()"></div>

  <div class="form-popup" id="createNewPost">
    <form class="form-container">
      <div class="input-group">
        <label for="media-link"></label> <br/>
        <input id="new-media-link" name="media link" placeholder="Media link" required />
        <br/>
      </div>

      <div class="input-group">
        <label for="title"></label> <br />
          <input type="text" id="new-title" name="title" placeholder="Post title" required />
        <br />
      </div>

      <div class="input-group">
        <label for="text"></label> <br />
        <input type="text" id="new-text" name="text" placeholder="Text" required />
        <br />
      </div>

      <button type="button" class="btn" id="post-btn" title="post" onclick="createPost()">Post</button>
    </form>
  </div>

  <script src="{{ url_for('static', path='load_posts.js') }}"></script>
</body>
